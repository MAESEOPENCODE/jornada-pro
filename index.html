<style>
:root{
  --ink:#16232F; --steel:#2E4A63; --steel-2:#3E6284; --amber:#E8A23A; --amber-d:#C6841F;
  --mist:#EEF2F5; --paper:#FFFFFF; --line:#D7DEE3; --ok:#2F8F5B; --bad:#C24B3F; --txt:#1B2733; --txt-dim:#5C6B78;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --mist:#0F1620; --paper:#182430; --line:#2B3A48; --txt:#E7EDF2; --txt-dim:#8FA1AF; --ink:#E7EDF2; }
}
:root[data-theme="dark"]{ --mist:#0F1620; --paper:#182430; --line:#2B3A48; --txt:#E7EDF2; --txt-dim:#8FA1AF; --ink:#E7EDF2; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--mist);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden;}
h1,h2,h3,.brand{font-family:'Archivo',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#1B2C3A,var(--ink) 70%);color:#fff;padding:14px 20px calc(14px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.brand{font-size:20px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
.brand-icon{width:28px;height:28px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.35);}
.brand .dot{width:9px;height:9px;background:var(--amber);border-radius:50%;box-shadow:0 0 8px 1px #E8A23A99;}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:#B7C4CE;}
select{background:#22323F;color:#fff;border:1px solid #33465490;border-radius:8px;padding:7px 10px;font-size:13px;}
main{max-width:920px;margin:0 auto;padding:20px 16px 40px;}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,32,.04), 0 8px 20px -12px rgba(16,24,32,.18);}
.clockwrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 20px;position:relative;}
.clockwrap::before{content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);width:220px;height:220px;background:radial-gradient(circle,var(--amber) 0%,transparent 68%);opacity:.10;pointer-events:none;}
.bignum{font-size:clamp(40px,10vw,64px);font-weight:600;letter-spacing:-.01em;line-height:1;position:relative;}
.datestr{color:var(--txt-dim);font-size:14px;margin-top:4px;position:relative;}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 12px;border-radius:20px;margin-top:14px;background:var(--mist);border:1px solid var(--line);position:relative;}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--txt-dim);}
.status-pill.on .dot{background:var(--ok);box-shadow:0 0 6px 1px #2F8F5B88;}
.status-pill.pause .dot{background:var(--amber);box-shadow:0 0 6px 1px #E8A23A88;}
.actions{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;justify-content:center;position:relative;}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:13px 22px;font-weight:700;font-size:15px;transition:transform .08s ease, box-shadow .08s ease;}
button:active{transform:scale(.97);}
.icon-btn{display:flex;align-items:center;gap:10px;padding:10px 20px 10px 12px;}
.icon-btn img{width:34px;height:34px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));}
.btn-in{background:linear-gradient(180deg,#379B67,var(--ok));color:#fff;box-shadow:0 4px 12px -4px #2F8F5B99;}
.btn-out{background:linear-gradient(180deg,#D2594B,var(--bad));color:#fff;box-shadow:0 4px 12px -4px #C24B3F99;}
.btn-pause{background:linear-gradient(180deg,#F0AE4D,var(--amber));color:#3A2600;box-shadow:0 4px 12px -4px #E8A23A99;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt);}
.btn-steel{background:linear-gradient(180deg,var(--steel-2),var(--steel));color:#fff;box-shadow:0 4px 12px -4px #2E4A6399;}
h3.section{font-size:14px;text-transform:none;color:var(--txt-dim);margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:9px;}
.sec-icon{width:26px;height:26px;display:inline-block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
.log-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
.log-row:last-child{border-bottom:none;}
.log-type{font-weight:700;}
.tag-entrada{color:var(--ok);} .tag-salida{color:var(--bad);} .tag-pausa{color:var(--amber-d);}
.week{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:6px;}
.week .bar{flex:1;background:linear-gradient(180deg,var(--steel-2),var(--steel));border-radius:6px 6px 2px 2px;position:relative;min-height:4px;}
.week .lbl{font-size:11px;color:var(--txt-dim);text-align:center;margin-top:6px;}
table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;color:var(--txt-dim);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);}
td{padding:10px 8px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
.badge{font-size:12px;padding:3px 9px;border-radius:20px;font-weight:700;}
.badge.on{background:#2F8F5B22;color:var(--ok);} .badge.off{background:#C24B3F22;color:var(--bad);} .badge.pause{background:#E8A23A22;color:var(--amber-d);}
.rowflex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.hint{font-size:13px;color:var(--txt-dim);}
.scroll-x{overflow-x:auto;}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.toast.show{opacity:1;}
footer{text-align:center;color:var(--txt-dim);font-size:12px;padding:10px 20px 30px;}
</style>
</head>

// Coordenadas del centro (demo: Palma del Río, Córdoba). Sustituye por las reales de cada nave.
// Los centros de trabajo ya no vienen predefinidos: se crean desde el panel de administrador (db.centros).
function distMeters(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function getGeo(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      ()=>res(null),
      {timeout:5000}
    );
  });
}

function _jModalShow({msg, showInput=false, showCancel=false, defaultValue=''}){
  return new Promise(resolve=>{
    const modal=document.getElementById('jModal');
    const msgEl=document.getElementById('jModalMsg');
    const inputEl=document.getElementById('jModalInput');
    const okBtn=document.getElementById('jModalOk');
    const cancelBtn=document.getElementById('jModalCancel');
    msgEl.textContent = msg;
    inputEl.style.display = showInput? 'block':'none';
    inputEl.value = defaultValue||'';
    cancelBtn.style.display = showCancel? 'inline-block':'none';
    modal.style.display='flex';
    function cleanup(result){
      modal.style.display='none';
      okBtn.onclick=null; cancelBtn.onclick=null; inputEl.onkeydown=null;
      resolve(result);
    }
    okBtn.onclick=()=>cleanup(showInput ? (inputEl.value||null) : true);
    cancelBtn.onclick=()=>cleanup(showInput? null : false);
    if(showInput){
      setTimeout(()=>inputEl.focus(),50);
      inputEl.onkeydown=(e)=>{ if(e.key==='Enter') cleanup(inputEl.value||null); };
    }
  });
}
window.jConfirm = (msg)=>_jModalShow({msg, showCancel:true});

function fmtTime(ts){return new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(ts){return new Date(ts).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});}
function todayKey(ts=Date.now()){return new Date(ts).toISOString().slice(0,10);}

function recordsFor(empId, dayKey){return db.records.filter(r=>r.empId===empId && todayKey(r.ts)===dayKey);}
function lastStateFor(empId){
  const recs = db.records.filter(r=>r.empId===empId).sort((a,b)=>a.ts-b.ts);
  return recs.length? recs[recs.length-1].type : null;
}
function hoursWorked(empId, dayKey){
  const recs = recordsFor(empId, dayKey).sort((a,b)=>a.ts-b.ts);
  let total=0, openIn=null;
  recs.forEach(r=>{
    if(r.type==='entrada'){ openIn=r.ts; }
    else if((r.type==='salida'||r.type==='pausa') && openIn!==null){ total += r.ts-openIn; openIn = r.type==='pausa'? null : null; }
    else if(r.type==='reanuda'){ openIn=r.ts; }
  });
  if(openIn!==null) total += Date.now()-openIn;
  return total;
}
function fmtDur(ms){
  const h=Math.floor(ms/3600000), m=Math.floor((ms%3600000)/60000);
  return h+'h '+String(m).padStart(2,'0')+'m';
}
function notify(title, body){

async function clock(empId,type){

  if(geo && center){
    inRange = distMeters(geo.lat,geo.lng,center.lat,center.lng) <= center.radius;
  }

async function initMiniMap(empId){

  miniMap = L.map('miniMap', {zoomControl:false, attributionControl:false, dragging:false, scrollWheelZoom:false}).setView([center.lat,center.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(miniMap);
  L.circle([center.lat,center.lng], {radius:center.radius, color:'#3E6284', fillColor:'#3E6284', fillOpacity:0.15}).addTo(miniMap);
  L.marker([center.lat,center.lng]).addTo(miniMap).bindPopup(emp.centro);
  const geo = await getGeo();
  if(geo){
    const inRange = distMeters(geo.lat,geo.lng,center.lat,center.lng) <= center.radius;
    L.circleMarker([geo.lat,geo.lng], {radius:7, color: inRange?'#2F8F5B':'#C24B3F', fillColor: inRange?'#2F8F5B':'#C24B3F', fillOpacity:0.9}).addTo(miniMap).bindPopup(inRange?'Estás dentro del centro':'Estás fuera del centro');

function weekBars(empId){
  const days=[]; const now=new Date();
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(now.getDate()-i); days.push(d); }
  const maxMs = 9*3600000;
  return days.map(d=>{
    const key=todayKey(d.getTime());
    const ms = key===todayKey()? hoursWorked(empId,key) : (recordsFor(empId,key).length? hoursWorked(empId,key): 0);
    const pct = Math.min(100, (ms/maxMs)*100);
    return {label:d.toLocaleDateString('es-ES',{weekday:'short'}).slice(0,1).toUpperCase()+d.toLocaleDateString('es-ES',{weekday:'short'}).slice(1,2), pct, ms};
  });
}

function monthKey(ts=Date.now()){return new Date(ts).toISOString().slice(0,7);}
function hoursForMonth(empId, mKey){
  let total=0;
  const [y,m]=mKey.split('-').map(Number);
  const dim=new Date(y,m,0).getDate();
  for(let d=1; d<=dim; d++){
    const dayKey = mKey+'-'+String(d).padStart(2,'0');
    if(recordsFor(empId,dayKey).length) total += hoursWorked(empId, dayKey);
  }
  return total;
}
function isSigned(empId, mKey){ return db.signatures.find(s=>s.empId===empId && s.month===mKey); }
function signMonth(empId){
  const mKey = monthKey();
  if(isSigned(empId,mKey)) return;
  const emp = db.employees.find(e=>e.id===empId);
  const recs = db.records.filter(r=>r.empId===empId && monthKey(r.ts)===mKey);
  const raw = recs.map(r=>r.id+r.ts+r.type).join('|');
  let hash=0; for(let i=0;i<raw.length;i++){hash=(hash*31+raw.charCodeAt(i))>>>0;}
  db.signatures.push({empId, month:mKey, name:emp.name, ts:Date.now(), hash:hash.toString(16)});
  save();
  toast('Registro firmado');
  render();
}
function exportMonthlyCSV(){
  const mKey = monthKey();
  let csv='Empleado,Centro,Horas del mes,Firmado,Fecha firma,Hash\n';
  db.employees.forEach(e=>{
    const h = hoursForMonth(e.id, mKey);
    const sig = isSigned(e.id, mKey);
    csv+=`${e.name},${e.centro},${fmtDur(h)},${sig?'Sí':'No'},${sig?new Date(sig.ts).toLocaleString('es-ES'):''},${sig?sig.hash:''}\n`;
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`informe_${monthKey()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function buildCalendarHtml(){
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+calMonthOffset);
  const year=base.getFullYear(), month=base.getMonth();
  const first = new Date(year,month,1);
  const startDow = (first.getDay()+6)%7; // lunes=0
  const daysInMonth = new Date(year,month+1,0).getDate();
  const monthLabel = base.toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  let cells=[];
  for(let i=0;i<startDow;i++) cells.push('<div></div>');
  for(let d=1; d<=daysInMonth; d++){
    const dk = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const auss = ausenciasOnDate(dk);
    const names = auss.map(a=>{const e=db.employees.find(x=>x.id===a.empId); return e?e.name.split(' ')[0]:'';}).filter(Boolean);
    cells.push(`<div style="min-height:54px;border:1px solid var(--line);border-radius:6px;padding:4px;font-size:11px;">
      <div class="mono" style="color:var(--txt-dim);">${d}</div>
      ${names.slice(0,3).map(n=>`<div style="background:#E8A23A22;color:var(--amber-d);border-radius:4px;padding:1px 4px;margin-top:2px;">${n}</div>`).join('')}
      ${names.length>3?`<div class="hint">+${names.length-3}</div>`:''}
    </div>`);
  }
  return `<div class="rowflex">
    <button class="btn-ghost" style="padding:5px 10px;" onclick="navCal(-1)">←</button>
    <strong style="text-transform:capitalize;">${monthLabel}</strong>
    <button class="btn-ghost" style="padding:5px 10px;" onclick="navCal(1)">→</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;">
    ${['L','M','X','J','V','S','D'].map(d=>`<div class="hint" style="text-align:center;font-weight:700;">${d}</div>`).join('')}
    ${cells.join('')}
  </div>`;
}

function exportMonthlyPDF(){

  function drawHeader(){
    doc.setFillColor(...INK);
    doc.rect(0,0,pageW,30,'F');
    doc.setFillColor(...AMBER);
    doc.rect(0,30,pageW,1.4,'F');

    doc.setFontSize(8.5); doc.setTextColor(220,225,230);
    doc.text('Cumplimiento RDL 8/2019 — registro de jornada', pageW-12, 21, {align:'right'});
  }
  function drawFooter(){
    const n = doc.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){
      doc.setPage(i);
      doc.setDrawColor(...MIST); doc.setLineWidth(0.3);
      doc.line(12, pageH-14, pageW-12, pageH-14);
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(120,130,140);
      doc.text('Generado el '+new Date().toLocaleDateString('es-ES')+' por Jornada — SAT GUADEX', 12, pageH-9);
      doc.text('Página '+i+' de '+n, pageW-12, pageH-9, {align:'right'});
    }
  }

  drawHeader();

  const rows = db.employees.map(e=>{
    const h = hoursForMonth(e.id, mKey);
    const sig = isSigned(e.id, mKey);
    return [e.name, e.centro||'—', fmtDur(h), sig? new Date(sig.ts).toLocaleDateString('es-ES') : 'Sin firmar'];
  });

  doc.autoTable({
    head: [['Empleado','Centro','Horas del mes','Firma']],
    body: rows,
    startY: 38,
    margin: {left:12, right:12, bottom:20},
    tableWidth: pageW-24,
    styles: { font:'helvetica', fontSize:10, cellPadding:4, lineColor:MIST, lineWidth:0.2, textColor:INK },
    headStyles: { fillColor:STEEL, textColor:255, fontStyle:'bold', halign:'left' },
    alternateRowStyles: { fillColor: [247,249,250] },
    columnStyles: {
      0:{cellWidth:'auto'}, 1:{cellWidth:'auto'},
      2:{cellWidth:32, halign:'right'}, 3:{cellWidth:36, halign:'right'}
    },
    didParseCell: (data)=>{
      if(data.section==='body' && data.column.index===3 && data.cell.raw==='Sin firmar'){
        data.cell.styles.textColor = [194,75,63];
      }
    },
    didDrawPage: drawHeader
  });

  let y = (doc.lastAutoTable ? doc.lastAutoTable.finalY : 38) + 12;
  if(y > pageH-40){ doc.addPage(); drawHeader(); y = 42; }
  doc.setDrawColor(...MIST);
  doc.setFillColor(...MIST);
  doc.roundedRect(12, y, pageW-24, 22, 2, 2, 'F');
  doc.setTextColor(...INK); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Total empleados: '+db.employees.length, 18, y+9);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(90,100,110);
  doc.text('Este informe recoge las horas trabajadas y el estado de la firma mensual de cada empleado.', 18, y+16);

  drawFooter();
  doc.save(`informe_${mKey}.pdf`);
}

function weekDates(){
  const now=new Date(); const dow=(now.getDay()+6)%7;
  const monday=new Date(now); monday.setDate(now.getDate()-dow);
  const arr=[]; for(let i=0;i<7;i++){const d=new Date(monday); d.setDate(monday.getDate()+i); arr.push(d);}
  return arr;
}

function horasConvenio(centro){ return (db.centrosConfig && db.centrosConfig[centro]) || 40; }
function weekTotalMs(empId){
  return weekDates().reduce((s,d)=>{const dk=todayKey(d.getTime()); return s+(recordsFor(empId,dk).length?hoursWorked(empId,dk):0);},0);
}
function extraWeekMs(empId){
  const emp=db.employees.find(e=>e.id===empId);
  const target=horasConvenio(emp?emp.centro:null)*3600000;
  return Math.max(0, weekTotalMs(empId) - target);
}

function addDocumento(empId){
  const inp=document.getElementById('docNombre_'+empId);
  const nombre = inp.value.trim();
  if(!nombre){toast('Escribe un nombre de documento');return;}
  db.documentos.push({id:'d'+Date.now(), empId, nombre, ts:Date.now()});
  save(); toast('Documento añadido'); render();
}

function addAviso(){
  const t=document.getElementById('avisoTitulo').value.trim();
  const x=document.getElementById('avisoTexto').value.trim();
  if(!t){toast('Escribe un título');return;}
  db.avisos.unshift({id:'v'+Date.now(), titulo:t, texto:x, ts:Date.now()});
  save(); toast('Aviso publicado'); render();
}
function addGasto(empId){
  const concepto=document.getElementById('gastoConcepto_'+empId).value.trim();
  const importe=parseFloat(document.getElementById('gastoImporte_'+empId).value);
  const fecha=document.getElementById('gastoFecha_'+empId).value || todayKey();
  if(!concepto||!importe){toast('Completa concepto e importe');return;}
  db.gastos.push({id:'g'+Date.now(), empId, concepto, importe, fecha, estado:'pendiente', ts:Date.now()});
  save(); toast('Gasto enviado'); render();
}
function updateGastoEstado(id, estado){
  const g=db.gastos.find(x=>x.id===id); if(!g) return;
  g.estado=estado; save(); render();
}

async function addEmpleado(){
  const nombre=(document.getElementById('empNombre').value||'').trim();
  const centro=document.getElementById('empCentro').value;
  const puesto=(document.getElementById('empPuesto').value||'').trim();
  const email=(document.getElementById('empEmail').value||'').trim();
  const pass=document.getElementById('empPass').value||'';
  const admin=document.getElementById('empAdmin').checked;
  if(!nombre){ toast('Escribe un nombre'); return; }
  if(!centro){ toast('Crea primero un centro de trabajo'); return; }
  if(!email || !pass || pass.length<6){ toast('Email y contraseña (mín. 6 caracteres) son obligatorios'); return; }
  if(!window._jCreateAuthUser){ toast('La conexión con Firebase todavía no está lista, espera un momento'); return; }
  const id='e'+Date.now()+Math.random().toString(36).slice(2,5);
  toast('Creando acceso…');
  const res = await window._jCreateAuthUser(email, pass);
  if(!res.ok){ toast('No se pudo crear el acceso: '+res.error); return; }
  db.employees.push({id, name:nombre, centro, puesto:puesto||'—', alta:todayKey(), email, authUid:res.uid, admin});
  save();
  refreshUserSel();
  document.getElementById('empNombre').value=''; document.getElementById('empPuesto').value='';
  document.getElementById('empEmail').value=''; document.getElementById('empPass').value='';
  document.getElementById('empAdmin').checked=false;
  toast('Empleado y acceso creados');
  render();
}
function toggleAdmin(empId, val){
  const e=db.employees.find(x=>x.id===empId); if(!e) return;
  e.admin = val;
  save(); toast(val?'Ahora es administrador':'Ya no es administrador'); render();
}
function quitarEmpleado(empId){
  if(db.employees.length<=1){ toast('Debe quedar al menos un empleado'); return; }
  window.jConfirm('¿Eliminar este empleado y todo su historial de fichajes? Su acceso de inicio de sesión seguirá existiendo en Firebase, pero quedará sin efecto.').then(ok=>{
    if(!ok) return;
    db.employees = db.employees.filter(e=>e.id!==empId);
    db.records = db.records.filter(r=>r.empId!==empId);
    db.signatures = db.signatures.filter(s=>s.empId!==empId);
    db.ausencias = db.ausencias.filter(a=>a.empId!==empId);
    db.documentos = db.documentos.filter(d=>d.empId!==empId);
    db.gastos = db.gastos.filter(g=>g.empId!==empId);
    delete db.bolsa[empId];
    save();
    if(currentUser===empId) currentUser = db.employees[0].id;
    refreshUserSel(); userSel.value = currentUser;
    toast('Empleado eliminado');
    render();
  });
}

function exportCSV(){
  let csv='Empleado,Tipo,Fecha,Hora\n';
  db.records.slice().sort((a,b)=>a.ts-b.ts).forEach(r=>{
    const emp=db.employees.find(e=>e.id===r.empId);
    csv+=`${emp?emp.name:''},${r.type},${todayKey(r.ts)},${fmtTime(r.ts)}\n`;
  });
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='registro_horario.csv'; a.click();
  URL.revokeObjectURL(url);
}

function render(){
  document.getElementById('app').innerHTML = role==='admin'? adminView() : employeeView(currentUser);
  if(role!=='admin') setTimeout(()=>initMiniMap(currentUser), 30);
}
setInterval(()=>{
  const el=document.getElementById('liveClock');
  if(el) el.textContent = new Date().toLocaleTimeString('es-ES');
},1000);
render();
</script>

};
const fbApp = initializeApp(firebaseConfig, 'jornada');
const fdb = getFirestore(fbApp);
const fauth = getAuth(fbApp);
let docRef = null, applyingRemote = false;
const SHARED_PATH = ['empresas','sat-guadex','jornada','data'];

// Crea una cuenta de acceso para un empleado SIN cerrar la sesión del administrador actual.
window._jCreateAuthUser = async function(email, pass){
  const tempApp = initializeApp(firebaseConfig, 'temp-'+Date.now());
  const tempAuth = getAuth(tempApp);
  try{
    const cred = await createUserWithEmailAndPassword(tempAuth, email, pass);
    const uid = cred.user.uid;
    await signOut(tempAuth);
    await deleteApp(tempApp);
    return { ok:true, uid };
  }catch(e){
    try{ await deleteApp(tempApp); }catch(_){}
    return { ok:false, error: e.message };
  }
};

window._jornadaLogin = async function(){
  const raw=(document.getElementById('jUser').value||'').trim();
  const pass=document.getElementById('jPass').value||'';
  if(!raw||!pass) return;
  const email = raw.includes('@')? raw : raw+'@jornada.app';
  try{
    await signInWithEmailAndPassword(fauth, email, pass);
  }catch(e){
    const dbNow = window._jGetDb();
    const hayAdmin = dbNow.employees && dbNow.employees.some(emp=>emp.admin);
    if(!hayAdmin){
      try{ await createUserWithEmailAndPassword(fauth, email, pass); }
      catch(e2){ await window.jAlert('No se pudo crear la cuenta: '+e2.message); }
    } else {
      await window.jAlert('Usuario o contraseña incorrectos. Contacta con tu administrador si no tienes acceso.');
    }
  }
};
window._jornadaLogout = ()=>signOut(fauth);

onAuthStateChanged(fauth, async user=>{
  if(!user){ document.getElementById('loginGate').style.display='flex'; return; }
  document.getElementById('loginGate').style.display='none';
  docRef = doc(fdb, ...SHARED_PATH);
  try{
    const snap = await getDoc(docRef);
    if(!snap.exists()){
      // Documento compartido nuevo: intenta migrar los datos del formato antiguo (un solo login de empresa)
      const oldRef = doc(fdb,'users',user.uid,'jornada','data');
      const oldSnap = await getDoc(oldRef);
      const initial = oldSnap.exists() ? oldSnap.data() : window._jGetDb();
      await setDoc(docRef, initial);
    }
  }catch(e){ console.error(e); }

  onSnapshot(docRef, snap=>{
    if(snap.exists()){ applyingRemote=true; window._jSetDb(snap.data()); applyingRemote=false; }
    handleAuthUser(user);
  });
});

let _jBootstrapping = false;
async function handleAuthUser(user){
  const dbNow = window._jGetDb();
  const yaVinculado = dbNow.employees.find(e=>e.authUid===user.uid);
  const hayAdmin = dbNow.employees.some(e=>e.admin);
  if(yaVinculado){
    window._jApplyAccessForUser(user.uid);
    if(typeof window.render==='function') window.render();
    return;
  }
  if(!hayAdmin){
    if(_jBootstrapping) return;
    _jBootstrapping = true;
    // Primer arranque: esta cuenta se convierte en la administradora inicial
    const nombre = ((await window.jPrompt('Bienvenido. Escribe tu nombre y apellidos para crear tu perfil de administrador:'))||'Administrador').trim();
    const centro = Object.keys(window._jGetCenters?window._jGetCenters():{})[0] || dbNow.employees[0]?.centro || '';
    const id = 'e'+Date.now()+Math.random().toString(36).slice(2,5);
    dbNow.employees.push({id, name:nombre, centro, puesto:'Administrador', alta:new Date().toISOString().slice(0,10), email:user.email, authUid:user.uid, admin:true});
    window._jSetDb(dbNow);
    window._jSaveNow();
    window._jApplyAccessForUser(user.uid);
    if(typeof window.render==='function') window.render();
    _jBootstrapping = false;
  } else {
    await window.jAlert('Tu cuenta no está vinculada a ningún empleado todavía. Pide a tu administrador que te dé de alta desde el panel de Empleados.');
    signOut(fauth);
  }
}
window._jCloudSave = (data)=>{ if(docRef && !applyingRemote) setDoc(docRef, data); };
</script>
